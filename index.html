
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXUS PLAYER | The Future of Video</title>

  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.5.0/video.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #14264a, #050713 65%);
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      border-bottom: 1px solid #00eaff55;
      background: #080d1ddd;
    }

    .logo {
      margin: 0;
      font-size: clamp(27px, 7vw, 42px);
      letter-spacing: 6px;
      color: #00eaff;
      text-shadow: 0 0 12px #00eaff;
    }

    .tagline {
      color: #9aaaca;
      font-size: 11px;
      letter-spacing: 5px;
      margin-top: 10px;
    }

    main {
      max-width: 1000px;
      width: 92%;
      margin: 40px auto;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      color: #00eaff;
      font-size: 26px;
    }

    .welcome p {
      color: #9aaaca;
    }

    .player-box {
      padding: 12px;
      border-radius: 18px;
      background: #101a30;
      border: 1px solid #00eaff;
      box-shadow:
        0 0 15px #00eaff44,
        0 0 45px #7b2cff22;
    }

    video-player {
      display: block;
      width: 100%;
    }

    video-skin {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
    }

    .system {
      text-align: center;
      margin-top: 22px;
      color: #00ffad;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .feature {
      padding: 18px 8px;
      text-align: center;
      background: #111b30;
      border: 1px solid #263a60;
      border-radius: 12px;
      color: #00eaff;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      color: #71809f;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      main {
        margin: 25px auto;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="logo">NEXUS PLAYER</h1>
    <div class="tagline">THE FUTURE OF VIDEO</div>
  </header>

  <main>

    <section class="welcome">
      <h2>ENTER THE NEXUS</h2>
      <p>Your next-generation video experience.</p>
    </section>

    <section class="player-box">

      <video-player>
        <video-skin>
          <video
            src="https://vjs.zencdn.net/v/oceans.mp4"
            poster="https://vjs.zencdn.net/v/oceans.png"
            playsinline
            preload="metadata">
            <a href="https://vjs.zencdn.net/v/oceans.mp4">
              Play video
            </a>
          </video>
        </video-skin>
      </video-player>

      <div class="system">
        ● NEXUS SYSTEM ONLINE
      </div>

    </section>

    <section class="features">
      <div class="feature">VIDEO ENGINE</div>
      <div class="feature">NEON INTERFACE</div>
      <div class="feature">MOBILE READY</div>
    </section>

  </main>

  <footer>
    NEXUS PLAYER © 2026
    <br><br>
    POWERED BY VIDEO.JS 10
  </footer>

</body>
</html>
